name: cloud-incident-copilot-demo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo-local-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d orders"]
      interval: 2s
      timeout: 3s
      retries: 20

  orders-api:
    build: ./orders-api
    ports:
      - "127.0.0.1:18080:8000"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: orders
      PGUSER: demo
      PGPASSWORD: demo-local-only
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 5s
      timeout: 5s
      retries: 2

volumes:
  postgres-data:
